<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>次回キャンペーン Coming Soon | 有限会社ツーボックス</title>
    <meta name="description" content="有限会社ツーボックス 次回キャンペーン準備中" />

    <link rel="icon" href="assets/logo.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f4 50%, #ffffff 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #2e7d32;
      }

      .container {
        text-align: center;
        max-width: 800px;
        width: 100%;
      }

      .logo {
        width: clamp(200px, 40vw, 300px);
        height: auto;
        margin-bottom: 48px;
        filter: drop-shadow(0 4px 12px rgba(46, 125, 50, 0.15));
      }

      h1 {
        font-size: clamp(32px, 6vw, 56px);
        font-weight: 700;
        color: #1b5e20;
        margin-bottom: 24px;
        letter-spacing: 0.02em;
      }

      .subtitle {
        font-size: clamp(18px, 4vw, 28px);
        font-weight: 500;
        color: #388e3c;
        margin-bottom: 48px;
        line-height: 1.6;
      }

      .message {
        font-size: clamp(14px, 3vw, 18px);
        color: #4caf50;
        line-height: 1.8;
        margin-bottom: 64px;
        padding: 0 20px;
      }

      .coming-soon-badge {
        display: inline-block;
        background: rgba(76, 175, 80, 0.1);
        border: 2px solid #66bb6a;
        border-radius: 50px;
        padding: 16px 48px;
        font-size: clamp(16px, 3vw, 24px);
        font-weight: 600;
        color: #2e7d32;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 48px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 20px 10px rgba(76, 175, 80, 0);
        }
      }

      .content-placeholder {
        background: rgba(255, 255, 255, 0.6);
        border: 2px dashed #81c784;
        border-radius: 16px;
        padding: 48px 32px;
        margin-bottom: 48px;
      }

      .content-placeholder h2 {
        font-size: clamp(20px, 4vw, 28px);
        color: #2e7d32;
        margin-bottom: 16px;
      }

      .content-placeholder p {
        font-size: clamp(14px, 3vw, 16px);
        color: #66bb6a;
        line-height: 1.8;
      }

      footer {
        margin-top: 64px;
        padding-top: 32px;
        border-top: 1px solid rgba(76, 175, 80, 0.2);
        color: #81c784;
        font-size: 14px;
      }

      /* レスポンシブ調整 */
      @media (max-width: 640px) {
        .coming-soon-badge {
          padding: 12px 32px;
        }

        .content-placeholder {
          padding: 32px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="assets/logo.png" alt="有限会社ツーボックス" class="logo" onerror="this.style.display='none'" />

      <h1>次回キャンペーン</h1>

      <div class="coming-soon-badge">Coming Soon</div>

      <p class="subtitle">準備中です</p>

      <p class="message">
        次回のキャンペーン詳細は、決まり次第こちらでお知らせします。<br>
        お楽しみに！
      </p>

      <!-- 今後コンテンツを追加していく場所 -->
      <div class="content-placeholder">
        <h2>キャンペーン情報</h2>
        <p>詳細は順次公開予定です</p>
      </div>

      <footer>
        <p>&copy; <span id="year"></span> 有限会社ツーボックス</p>
      </footer>
    </div>

    <script>
      // 年号を自動設定
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
